[package]
name              = "identus-did-core"
version.workspace = true
edition.workspace = true

[dependencies]
identus-apollo = { workspace = true, features = [ "base64", "serde", "jwk" ] }
identus-did    = { git = "https://github.com/hyperledger-identus/sdk-rust.git", rev = "1d5283105678a4e62253416454a60859111e635c" }
async-trait    = { workspace = true }
chrono         = { workspace = true, features = [ "serde" ] }
derive_more    = { workspace = true, features = [ "from", "display", "error" ] }
serde          = { workspace = true, features = [ "derive" ] }
serde_json     = { workspace = true }
ts-rs          = { workspace = true, optional = true }
utoipa         = { workspace = true, optional = true, features = [ "chrono" ] }
regex          = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [ "macros", "rt" ] }

[features]
default  = [  ]
openapi  = [ "dep:utoipa", "identus-apollo/openapi" ]
ts-types = [ "dep:ts-rs" ]
