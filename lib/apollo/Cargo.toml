[package]
name              = "identus-apollo"
version.workspace = true
edition.workspace = true

[dependencies]
derive_more = { workspace = true, features = [ "as_ref", "from", "into", "debug", "display", "error" ] }
serde       = { workspace = true, optional = true, features = [ "derive" ] }
utoipa      = { workspace = true, optional = true }

# Beta consumption of the generic crypto implementation extracted from
# NeoPRISM. Keep this immutable until sdk-rust publishes versioned crates.
identus-crypto = { workspace = true }

# Compatibility-only encoding DTOs. Cryptographic primitives are delegated to
# identus-crypto; codec convergence can follow without coupling the first beta
# to a wire-type migration.
base64 = { workspace = true, optional = true }
hex    = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
serde_json    = { workspace = true }

[features]
default   = [  ]
base64    = [ "dep:base64" ]
ed25519   = [ "jwk", "identus-crypto/ed25519" ]
hash      = [ "hex", "identus-crypto/hash" ]
hex       = [ "dep:hex" ]
jwk       = [ "base64", "identus-crypto/jwk" ]
openapi   = [ "serde", "dep:utoipa" ]
secp256k1 = [ "jwk", "identus-crypto/secp256k1" ]
serde     = [ "dep:serde" ]
x25519    = [ "jwk", "identus-crypto/x25519" ]
