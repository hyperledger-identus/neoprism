[package]
name              = "identus-did-resolver-http"
version.workspace = true
edition.workspace = true

[dependencies]
identus-did-core              = { workspace = true }
identus-sdk-did-resolver-http = { package = "identus-did-resolver-http", git = "https://github.com/hyperledger-identus/sdk-rust.git", rev = "523c64d4ff71d97f71c44b55c99594f065896b56" }
axum                          = { workspace = true }
utoipa                        = { workspace = true, optional = true, features = [ "chrono" ] }

[dev-dependencies]
async-trait    = { workspace = true }
tokio          = { workspace = true, features = [ "rt", "macros" ] }
tower          = { workspace = true }
http-body-util = { workspace = true }
serde_json     = { workspace = true }

[features]
default = [  ]
openapi = [
  "dep:utoipa",
  "identus-did-core/openapi",
  "identus-sdk-did-resolver-http/openapi",
]
