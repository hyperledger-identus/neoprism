[package]
name              = "identus-neoprism-did-resolver-http"
version.workspace = true
edition.workspace = true

[dependencies]
identus-did-core              = { workspace = true }
identus-sdk-did-resolver-http = { workspace = true }
axum                          = { workspace = true }
utoipa                        = { workspace = true, optional = true, features = [ "chrono" ] }

[dev-dependencies]
async-trait    = { workspace = true }
tokio          = { workspace = true, features = [ "rt", "macros" ] }
tower          = { workspace = true }
http-body-util = { workspace = true }
serde_json     = { workspace = true }

[features]
default = [  ]
openapi = [
  "dep:utoipa",
  "identus-did-core/openapi",
  "identus-sdk-did-resolver-http/openapi",
]
